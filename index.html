<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rox Locks</title>
<meta name="description" content="KingCap stream picks, checked against the betting sites.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#13202B; --muted:#5B6873; --line:#D9DFE1;
  --accent:#C2185B; --accent-ink:#FFFFFF; --head:#13202B; --head-ink:#F3F5F4; --gold:#FFC21A;
  --good:#2E7D32; --mid:#A87700; --bad:#C62828;
  --nfl:#1A3C8C; --nhl:#00838F; --nba:#E65100; --mlb:#6A1B9A; --ncaaf:#6D4C41; --other:#546E7A;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#172127; --ink:#E6ECEE; --muted:#9AA8B1; --line:#2A3740;
  --accent:#F06292; --accent-ink:#1A0710; --head:#0A1014; --head-ink:#E6ECEE;
  --good:#66BB6A; --mid:#E0B03A; --bad:#EF5350;
  --nfl:#5C7FD6; --nhl:#26A6B4; --nba:#FF8A3D; --mlb:#AB6BD6; --ncaaf:#B08463; --other:#8DA2AE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#172127; --ink:#E6ECEE; --muted:#9AA8B1; --line:#2A3740;
  --accent:#F06292; --accent-ink:#1A0710; --head:#0A1014; --head-ink:#E6ECEE;
  --good:#66BB6A; --mid:#E0B03A; --bad:#EF5350;
  --nfl:#5C7FD6; --nhl:#26A6B4; --nba:#FF8A3D; --mlb:#AB6BD6; --ncaaf:#B08463; --other:#8DA2AE; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink)}
header .wrap{padding-block:12px 0;display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase;margin:0;font-style:italic;transform:skewX(-6deg);transform-origin:left bottom}
.mark span{color:var(--gold);text-shadow:0 0 14px color-mix(in srgb,var(--gold) 45%,transparent)}
.mark small{display:block;font-style:normal;transform:skewX(6deg);transform-origin:left bottom;font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.08em;color:color-mix(in srgb,var(--head-ink) 65%,transparent);margin-top:4px}
.live{font:600 13px var(--f-body);color:color-mix(in srgb,var(--head-ink) 75%,transparent);display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand-r{display:flex;align-items:center;gap:10px}
.refresh{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid color-mix(in srgb,var(--head-ink) 30%,transparent);background:transparent;color:var(--head-ink);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.refresh:hover{background:color-mix(in srgb,var(--head-ink) 10%,transparent)}
.refresh:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.refresh svg{width:20px;height:20px}
.refresh.spin svg{animation:rspin .8s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.refresh.spin svg{animation:none;opacity:.5}}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.tab:focus-visible,.day:focus-visible,.btn:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr)}
@media (max-width:520px){.tab{font-size:14px;letter-spacing:.01em;padding:10px 1px 9px}}
@media (max-width:360px){.tab{font-size:13px;letter-spacing:0}}
#stats{display:none}
body.stats-mode #stats{display:block}
body.stats-mode main,body.stats-mode footer{display:none}
body.stats-mode .brand,body.stats-mode .tabs{margin-left:auto;margin-right:auto}
body[data-tab="bot"] main .wrap{grid-template-columns:minmax(0,1fr)!important;max-width:1020px}
@media (min-width:1340px){body[data-tab="bot"] .brand,body[data-tab="bot"] .tabs{margin-left:auto;margin-right:auto}}
@media (min-width:860px){body[data-tab="bot"] #view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}body[data-tab="bot"] #view .tp{margin-bottom:0!important}}
#stats iframe{display:block;width:100%;border:0;background:#000;height:calc(100vh - 120px)}
.tab{font:700 17px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--head-ink) 60%,transparent);background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px 9px;cursor:pointer;min-height:44px}
.tab{line-height:1.05}
.tab[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--accent)}
main .wrap{padding-block:14px 40px;display:grid;gap:14px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;font:600 14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px;white-space:nowrap}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slip-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.slip-head h2{font:800 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.when{font-size:13px;color:var(--muted)}
.state{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px}
.state h3{margin:0;font:800 20px var(--f-display);text-transform:uppercase}
.state p{margin:0;color:var(--muted)}
.btn{justify-self:start;font:700 15px var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;min-height:44px}
.skel{height:84px;border-radius:12px;background:linear-gradient(90deg,var(--surface),color-mix(in srgb,var(--line) 60%,var(--surface)),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.mail{display:grid;gap:10px;min-width:0;overflow-wrap:anywhere}
.mail p{margin:0}
.mail h3.sec{--h:var(--ink);margin:10px 0 0;font:800 19px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:color-mix(in srgb,var(--h) 75%,var(--ink));display:flex;align-items:center;gap:8px}
.mail h3.sec::after{content:"";flex:1;height:2px;background:color-mix(in srgb,var(--h) 35%,transparent)}
.card{--edge:var(--other);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--edge);border-radius:10px;padding:12px 14px;display:block;font-size:15px;min-width:0;scroll-margin-top:130px}
.card b:first-of-type{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.02em}
.card > div:first-child{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
.card > div:first-child b{flex:1 1 auto;min-width:0}
.card > div:first-child .badge{order:3;margin-left:auto}
.card > div:first-child .cat{order:2}
.kv .v li .badge{margin-left:auto}
.parlay{--edge:var(--accent)}
.parlay b:first-of-type{color:var(--accent)}
.chip{display:inline-block;font:700 12px/1.6 var(--f-body);letter-spacing:.04em;color:#fff;background:var(--sp,var(--other));border-radius:4px;padding:0 7px;vertical-align:2px;white-space:nowrap}
.badge{display:inline-block;font:700 12px/1.7 var(--f-body);letter-spacing:.05em;color:#fff;border-radius:999px;padding:0 9px;vertical-align:2px;background:var(--muted)}
.badge.high{background:var(--good)} .badge.medium{background:var(--mid)} .badge.low{background:var(--bad)}
.cat{display:inline-block;font:600 12px/1.6 var(--f-body);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;vertical-align:2px}
.meta{color:var(--muted);font-size:14px}
.fine{color:var(--muted);font-size:13px}
.hit{color:var(--good)} .miss{color:var(--bad)}
.agree{color:var(--good);font-weight:600} .disagree{color:var(--bad);font-weight:600}
.notice{background:color-mix(in srgb,var(--mid) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--mid) 45%,transparent);border-radius:8px;padding:8px 12px;font-size:14px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll table{border-collapse:collapse;font-size:14px;width:100%;font-variant-numeric:tabular-nums}
.scroll td,.scroll th{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.scroll tr:last-child td{border-bottom:0}
.mail ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.mail a{color:var(--accent)}
.odds{font-family:var(--f-mono);font-size:.92em}
.favs{display:flex;flex-wrap:wrap;gap:6px 8px;margin:4px 0}
.favs .fav{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--ink)}
.favs .fav b{font-weight:700;margin-left:4px}
.field-row{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.field-row label{font:700 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field-row input{font:600 16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;width:100%}
.quickadd{display:flex;gap:8px}
.quickadd select{flex:1;min-width:0;font:600 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}
.quickadd button{flex:none}
.addform{display:grid;grid-template-columns:1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.addform .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addform input{font:600 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;width:100%}
.addform input::placeholder{color:var(--muted)}
.addform-btn{font:700 15px var(--f-body);background:var(--gold);color:var(--head);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;min-height:44px}
.addform-btn:disabled{opacity:.45;cursor:not-allowed}
.bs-tool{display:grid;gap:14px}
.bs-intro{color:var(--muted);font-size:14px;margin:0}
.bs-list{display:grid;gap:10px}
.bs-row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.bs-row .top{display:flex;align-items:baseline;gap:8px}
.bs-row .ttl{flex:1;font:700 16px var(--f-body)}
.bs-row .rm{flex:none;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.bs-row .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bs-row .calc{font-size:13px;color:var(--muted)}
.bs-summary{display:grid;gap:10px}
.flag{border-radius:10px;padding:10px 14px;display:grid;gap:2px;font-size:14px}
.flag b{font:800 13px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.flag.good{background:color-mix(in srgb,var(--good) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 45%,transparent)}
.flag.warn{background:color-mix(in srgb,var(--mid) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--mid) 45%,transparent)}
.flag.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.addbtn{margin-top:8px;font:700 13px var(--f-body);background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:6px 10px;cursor:pointer}
.glance{display:grid;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--head);color:var(--head-ink);border-radius:10px;padding:10px 10px 9px;display:grid;align-content:start;gap:1px;min-width:0}
.tile b{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--head-ink)}
.tile span{font:700 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--head-ink) 75%,transparent)}
.tile small{font-size:12px;color:color-mix(in srgb,var(--head-ink) 60%,transparent);overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
button.row{cursor:pointer}
button.row::after{content:"›";margin-left:auto;color:var(--muted);font-size:20px;line-height:1}
.row .lbl{font:700 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);flex:none}
.row .val{font-weight:600;min-width:0}
.row .val.muted{color:var(--muted);font-weight:400}
.row .val b{font:800 18px var(--f-display);font-variant-numeric:tabular-nums}
.res-list{display:grid;gap:8px}
.res-row{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:10px;padding:10px 14px;display:grid;gap:4px;min-width:0}
.res-row.hit{border-left-color:var(--good)} .res-row.miss{border-left-color:var(--bad)} .res-row.pending{border-left-color:var(--mid)}
.res-row.hit{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:color-mix(in srgb,var(--good) 45%,var(--line));border-left-color:var(--good)}
.res-row.miss{background:color-mix(in srgb,var(--bad) 18%,var(--surface));border-color:color-mix(in srgb,var(--bad) 45%,var(--line));border-left-color:var(--bad)}
.res-top{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.res-title{font:700 18px/1.15 var(--f-display);letter-spacing:.02em;flex:1 1 140px;min-width:0}
.pill{font:700 12px/1.8 var(--f-body);letter-spacing:.05em;border-radius:999px;padding:0 10px;color:#fff;background:var(--muted);white-space:nowrap}
.pill.hit{background:var(--good)} .pill.miss{background:var(--bad)} .pill.pending{background:var(--mid)}
.res-note{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.res-row.hit .res-note,.res-row.miss .res-note,.res-row.push .res-note{color:var(--ink);font-weight:600}
.kvs{display:grid;gap:10px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.kv .k{font:700 17px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kv .k b{font:inherit}
.kv .v{list-style:none;padding:0;margin:0;display:grid;gap:0}
.kv .v li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px;padding:7px 0;border-top:1px solid var(--line)}
.kv .v li:first-child{border-top:0;padding-top:2px}
.divider{font:700 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px;margin-top:10px}
.divider::after{content:"";flex:1;height:2px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.plain{white-space:pre-wrap;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
footer{font-size:12px;color:var(--muted);text-align:center;padding-bottom:24px}
.slips{display:grid;gap:10px}
.slip{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--good);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.slip-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.slip-top b{font:700 19px var(--f-display);letter-spacing:.02em}
.slip-legs{list-style:none;margin:0;padding:0;display:grid;gap:0}
.slip-legs li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px;padding:6px 0;border-top:1px solid var(--line)}
.slip-legs li:first-child{border-top:0;padding-top:0}
.pay{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-radius:6px;padding:6px 10px;font-size:14px}
.shot{display:block;width:100%;max-width:420px;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.shot-missing{font-size:13px;color:var(--muted)}
#col{display:grid;gap:14px;min-width:0}
#side{min-width:0}
.tp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tp-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;padding:12px 14px;min-height:48px;cursor:pointer}
.tp-title{font:800 20px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.tp-when{font-size:12px;color:var(--muted);margin-left:auto}
.chev{display:inline-block;width:1em;color:var(--muted);flex:none}
.tp-head:focus-visible,.wk-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tp-body{padding:2px 14px 14px;display:grid;gap:10px;border-top:1px solid var(--line)}
.tp-body[hidden]{display:none}
.tp-body p{margin:0}
.tp-body p b{font:700 16px var(--f-display);letter-spacing:.04em}
.tp-body > p:first-child{margin-top:10px}
.tp-body > p:first-child b{font:800 30px/1 var(--f-display)}
.tp-body .scroll{background:none}
.tp-body td:not(:first-child),.tp-body th:not(:first-child){text-align:right;white-space:nowrap}
.tp-body tr.wk td{background:color-mix(in srgb,var(--ink) 6%,var(--surface));font-weight:700}
.tp-body tr.dy td:first-child{padding-left:26px;color:var(--muted)}
.wk-btn{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;min-height:28px}
.sites{display:grid;margin:8px 0 4px}
.gm{margin:6px 0 2px}
.gm-top{font-size:13px;color:var(--muted)}
.gm-key{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:700;font-size:15px;margin-top:1px}
.gm-st{font:600 11px/1.7 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.site-d.val{color:var(--ink);font-weight:700}
.site.kc .site-n{color:var(--accent)}
.site.kc .site-d{color:var(--ink)}
.gm-note{font-size:13px;color:var(--muted);padding:6px 0;border-top:1px solid var(--line)}
.sites-h{font:700 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 0 4px}
.site{display:grid;grid-template-columns:minmax(5.5rem,7.5rem) minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35}
.site-n{font-weight:700}
.site-d{color:var(--muted);min-width:0}
.vd{font:700 11px/1.9 var(--f-body);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:0 9px;color:#fff;white-space:nowrap;justify-self:end;background:var(--muted)}
.vd.vd-agree{background:var(--good)} .vd.vd-disagree{background:var(--bad)}
@media (max-width:480px){.site{grid-template-columns:minmax(0,1fr) auto}.site-d{grid-column:1/-1;order:3}}
.bot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.bot-h{display:flex;flex-direction:column;gap:1px}
.bot-h b{font:800 17px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.bot-h small{font-size:12px;color:var(--muted)}
.bot-bank{display:flex;align-items:baseline;gap:10px;margin:8px 0 2px;flex-wrap:wrap}
.bot-bank strong{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.bot-bank .delta{font:700 17px var(--f-display)}
.bot-vs{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;font-size:14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bot-vs .n{font-weight:700} .bot-vs .r{text-align:right;color:var(--muted)}
.bot-lead{font-size:13px;font-weight:700;margin-top:6px}
.bot-meta{font-size:12px;color:var(--muted);margin-top:4px}
.bot-sec{font:700 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.bot-day-head{font:800 15px var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:var(--ink);margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.gfi{margin-top:12px;border:1px solid color-mix(in srgb,var(--mid) 55%,var(--line));background:color-mix(in srgb,var(--mid) 10%,var(--surface));border-radius:10px;padding:10px 12px}
.gfi-l{font:800 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--mid);display:flex;justify-content:space-between;align-items:center;gap:8px}
.gfi-c{font:700 17px/1.25 var(--f-display);margin:4px 0 2px}
.bb{padding:9px 0;border-top:1px solid var(--line)}
.bb-top{display:flex;align-items:center;gap:6px}
.bb-top b{flex:1 1 auto;min-width:0;font-size:15px}
.bb-odds{font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.bb-why{font-size:12px;color:var(--muted);margin-top:2px}
.bb-res{font-size:12px;margin-top:2px;font-weight:600}
.bb-legs{list-style:none;margin:4px 0 0;padding:0}
.bb-legs li{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0}
.bb-legs li span.s{flex:1 1 auto;min-width:0}
.bb-legs .mk{font-weight:800;width:14px;text-align:center}
.bot-days{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.bot-days th,.bot-days td{padding:5px 4px;border-top:1px solid var(--line);text-align:right}
.bot-days th:first-child,.bot-days td:first-child{text-align:left}
.bot-days th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-top:0}
.bot-empty{font-size:14px;color:var(--muted);margin-top:10px}
#bot{display:none}
@media (min-width:1000px){
  .wrap{max-width:1020px}
  .brand,.tabs{max-width:640px}
  main .wrap{grid-template-columns:minmax(0,640px) 340px;gap:20px;align-items:start}
  #side{position:sticky;top:126px;max-height:calc(100vh - 146px);overflow-y:auto}
}
@media (min-width:1340px){
  .wrap{max-width:1340px}
  .brand,.tabs{margin-left:320px}
  main .wrap{grid-template-columns:300px minmax(0,640px) 340px}
  #bot{display:block;position:sticky;top:126px;max-height:calc(100vh - 146px);overflow-y:auto}
  #bot:empty{display:none}
}
.lv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.lv-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lv-head h3{margin:0;font:800 19px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.lv-stamp{font-size:13px;color:var(--muted)} .lv-stamp.on{color:var(--good);font-weight:700}
.lv-stamp.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;animation:lvp 1.4s ease-in-out infinite}
@keyframes lvp{50%{opacity:.25}} @media (prefers-reduced-motion:reduce){.lv-stamp.on::before{animation:none}}
.lv-sum{margin:0;font-size:14px;color:var(--muted)}
.lv-list{display:grid;gap:6px}
.lv-row{border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:8px;padding:7px 10px;min-width:0}
.lv-row.r-hit{border-left-color:var(--good)} .lv-row.r-miss{border-left-color:var(--bad)} .lv-row.r-live{border-left-color:var(--gold)} .lv-row.r-push{border-left-color:var(--mid)}
.lv-top{display:flex;align-items:center;gap:8px;min-width:0} .lv-top b{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
.lv-right{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;flex:none}
.lv-val{font:800 18px var(--f-display);letter-spacing:.03em;white-space:nowrap}
.r-hit .lv-val{color:var(--good)} .r-miss .lv-val{color:var(--bad)}
.lv-res{font:800 13px var(--f-display);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.r-hit .lv-res{color:var(--good)} .r-miss .lv-res{color:var(--bad)} .r-live .lv-res{color:var(--mid)} .r-push .lv-res{color:var(--mid)}
.lv-sub{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.fresh{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;font:600 12px/1.3 "Source Sans 3",system-ui,sans-serif;color:var(--head-ink);opacity:.85}.fresh span.old{color:var(--gold);opacity:1}.fresh span.old::before{content:"⚠ "}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1 class="mark">Rox <span>Locks</span><small id="checked">Loading picks…</small></h1>
      <div class="brand-r">
        <span class="live" id="live" hidden><i aria-hidden="true"></i>Live</span>
        <button class="refresh" id="refresh" type="button" aria-label="Refresh picks" title="Refresh picks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
      </div>
    </div>
    <div class="fresh" id="fresh" aria-live="polite"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-picks" data-tab="picks" aria-selected="true">Picks</button>
      <button class="tab" role="tab" id="tab-results" data-tab="results" aria-selected="false">Results</button>
      <button class="tab" role="tab" id="tab-ml" data-tab="ml" aria-selected="false">KingCap Parlays</button>
      <button class="tab" role="tab" id="tab-slip" data-tab="slip" aria-selected="false">Bet Slip</button>
      <button class="tab" role="tab" id="tab-bot" data-tab="bot" aria-selected="false">Accuracy Tracker</button>
      <button class="tab" role="tab" id="tab-stats" data-tab="stats" aria-selected="false">SharpSheet</button>
    </div>
  </div>
</header>
<main>
  <div class="wrap">
    <aside id="bot" aria-label="Rox Locks Computer"></aside>
    <div id="col">
      <div class="days" id="days" aria-label="Earlier days"></div>
      <div id="view"><div class="skel"></div><div class="skel"></div></div>
    </div>
    <aside id="side" aria-label="Accuracy tracker" hidden></aside>
  </div>
</main>
<div id="stats"></div>
<footer class="wrap">KingCap stream picks, checked against the betting sites · updates on its own · for fun, not betting advice · 21+, gamble responsibly</footer>

<script>
(function(){
  const TABS = {
    picks:  { name: "Picks", empty: "No picks yet." },
    results:{ name: "Results", empty: "No results updates yet." },
    ml:     { name: "KingCap Parlays", empty: "No KingCap parlays yet." },
    slip:   { name: "Bet Slip", empty: "" },
    bot:    { name: "Accuracy Tracker", empty: "" },
    stats:  { name: "SharpSheet", empty: "" }
  };
  const BUILD = "2026-11-13c";   // bump on every index.html change; open pages compare this with the published copy and reload themselves
  const st = { tab: "picks", lists: {}, err: null, sel: {}, msgs: {}, checked: null, loaded: false, slips: {}, betslip: [], betslipSeq: 0, betBudget: "" };
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  const fmtDay = d => new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",month:"numeric",day:"numeric"}).format(d);
  const fmtTime = d => new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"}).format(d);
  const dayKey = d => new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(d);
  function stamp(){ const t = st.liveAt && (!st.checked || st.liveAt > st.checked) ? st.liveAt : st.checked; if (!t) return; $("checked").textContent = "Last update " + fmtDay(t) + ", " + fmtTime(t) + " ET"; }

  // "data as of" strip: when each feed last updated; amber when a daily feed is overdue
  function freshness(){
    const box = $("fresh"); if (!box) return;
    const now = Date.now(), H = 3600e3, out = [];
    const newest = k => { const l = st.msgs && st.lastBy && st.lastBy[k]; return l || null; };
    const add = (label, d, maxH) => {
      if (!d) { out.push([label + " --", false]); return; }
      const old = maxH && now - d > maxH * H;
      out.push([label + " " + fmtDay(d) + " " + fmtTime(d), old]);
    };
    add("Picks", newest("picks"), 0);
    add("Results", newest("results"), 40);
    const bu = st.bot && st.bot.updated ? new Date(st.bot.updated) : null;
    add("Computer", bu && !isNaN(bu) ? bu : null, 36);
    box.textContent = "";
    out.forEach(([t, old]) => { const s = el("span", old ? "old" : "", t); if (old) s.title = "Overdue: this normally updates daily"; box.append(s); });
  }
  function setTab(t, push){
    if (!TABS[t]) t = "picks";
    st.tab = t;
    try { localStorage.setItem("rlTab", t); } catch (e) {}
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    if (push) { try { history.replaceState(null, "", "#" + t); } catch(e) { location.hash = t; } }
    document.body.dataset.tab = t;
    showStats(t === "stats");
    render();
  }
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab, true)));
  window.addEventListener("hashchange", () => setTab(location.hash.slice(1), false));

  // each email: { id, kind: picks|results|ml, subject, sent (ISO), html, text }
  function onEmails(list){
    const by = { picks: [], results: [], ml: [] };
    let newest = null; const lastBy = {};
    list.forEach(v => {
      if (!v || !by[v.kind] || typeof v.sent !== "string" || typeof v.id !== "string") return;
      const date = new Date(v.sent);
      if (isNaN(date)) return;
      const key = v.id + ":" + v.sent + ":" + String((v.html || v.text || "").length);
      if (!st.msgs[v.id] || st.msgs[v.id].key !== key) {
        const node = typeof v.html === "string" && v.html ? fromHtml(v.html)
          : v.kind === "ml" ? fromMlPlain(typeof v.text === "string" ? v.text : "")
          : fromPlain(typeof v.text === "string" ? v.text : "");
        st.msgs[v.id] = { key, node, tracker: extractTracker(node), text: typeof v.text === "string" && v.text ? v.text : node.textContent || "" };
      }
      by[v.kind].push({ id: v.id, subject: String(v.subject || ""), date });
      if (!newest || date > newest) newest = date;
      if (!lastBy[v.kind] || date > lastBy[v.kind]) lastBy[v.kind] = date;
    });
    st.lastBy = lastBy;
    Object.keys(by).forEach(t => {
      st.lists[t] = group(by[t], t);
      if (!st.sel[t] || !st.lists[t].some(x => x.key === st.sel[t])) st.sel[t] = st.lists[t][0] && st.lists[t][0].key;
    });
    st.loaded = true; st.err = null;
    if (newest) { st.checked = newest; stamp(); } else $("checked").textContent = "Waiting for the first picks";
    $("live").hidden = false;
    freshness();
    render();
  }
  function group(list, t){
    const groups = new Map();
    list.forEach(x => {
      const k = dayKey(x.date);
      if (!groups.has(k)) groups.set(k, { key: k, date: x.date, items: [] });
      const g = groups.get(k); g.items.push(x); if (x.date > g.date) g.date = x.date;
    });
    const arr = Array.from(groups.values()).sort((a,b) => b.date - a.date);
    arr.forEach(g => g.items.sort((a,b) => t === "picks" ? a.date - b.date : b.date - a.date));
    return arr.slice(0, 5);
  }

  function stateBox(info){
    const box = el("div","state");
    box.append(el("h3",null,info.h), el("p",null,info.p));
    if (info.retry) {
      const b = el("button","btn","Try again"); b.type = "button";
      b.addEventListener("click", () => location.reload());
      box.append(b);
    }
    return box;
  }

  function render(){ if (st.tab === "stats") return; renderSide(); renderMain(); renderBotSide(); }
  // Sharp Sheet (sheet/ folder) shown full width in the Stats tab; the frame is created once and kept
  function sizeStats(){ const f = $("stats").firstElementChild; if (f) f.style.height = Math.max(320, window.innerHeight - document.querySelector("header").getBoundingClientRect().height) + "px"; }
  function showStats(on){
    document.body.classList.toggle("stats-mode", on);
    if (on && !$("stats").firstElementChild) {
      const f = document.createElement("iframe");
      f.src = "sheet/index.html"; f.title = "Sharp Sheet stats"; f.loading = "lazy";
      $("stats").append(f);
    }
    if (on) { sizeStats(); window.scrollTo(0, 0); }
  }
  window.addEventListener("resize", sizeStats);
  function renderMain(){
    const t = st.tab, view = $("view"), days = $("days");
    days.replaceChildren(); view.replaceChildren();
    if (st.err) { view.append(stateBox(st.err)); return; }
    if (!st.loaded) { view.append(el("div","skel"), el("div","skel")); return; }
    if (t === "slip") { renderBetSlip(view); return; }
    if (t === "results") { renderResults(view); return; }
    if (t === "bot") { const tf = trackerFull(); if (tf) view.append(tf); view.append(botPanel(true)); return; }
    const list = st.lists[t] || [];
    if (!list.length) { view.append(stateBox({ h: TABS[t].empty, p: "New ones show up here on their own after each KingCap stream." })); return; }
    list.forEach(g => {
      const b = el("button","day", fmtDay(g.date));
      b.type = "button"; b.setAttribute("aria-pressed", String(g.key === st.sel[t]));
      b.addEventListener("click", () => { st.sel[t] = g.key; render(); });
      days.append(b);
    });
    const g = list.find(x => x.key === st.sel[t]) || list[0];
    const head = el("div","slip-head");
    head.append(el("h2", null, cleanSubject(g.items[0].subject).replace(/\s*\(Update\)\s*$/i, "")));
    const n = g.items.length;
    head.append(el("span","when", (n > 1 ? n + " updates · last " : "Sent ") + fmtTime(g.date) + " ET"));
    view.append(head);
    if (t === "picks") { const gl = glance(g); if (gl) view.append(gl); const lv = liveSection(g); if (lv) view.append(lv); const sl = slipSection(g.key); if (sl) view.append(sl); }
    g.items.forEach((item, i) => {
      if (n > 1) {
        const label = t === "picks" ? (i === 0 ? "First picks" : "Update " + i) : (i === 0 ? "Latest" : "Earlier");
        view.append(el("div","divider", label + " · " + fmtTime(item.date) + " ET"));
      }
      const msg = st.msgs[item.id];
      if (msg) view.append(msg.node);
    });
  }

  const toMin = s => { const m = /(\d{1,2}):(\d{2})\s*([AP])M/i.exec(s); if (!m) return null; let h = +m[1] % 12; if (/p/i.test(m[3])) h += 12; return h * 60 + +m[2]; };
  function tile(big, label, sub){
    const d = el("div","tile"); d.append(el("b",null,big), el("span",null,label)); if (sub) d.append(el("small",null,sub)); return d;
  }
  function glance(g){
    const nodes = g.items.map(i => st.msgs[i.id]);
    if (nodes.some(m => !m || !m.node)) return null;
    const roots = nodes.map(m => m.node);
    const cards = roots.flatMap(n => Array.from(n.querySelectorAll(".card:not(.parlay):not(.slip)")));
    if (!cards.length) return null;
    const sports = {};
    let high = 0, first = null, firstTxt = "";
    cards.forEach(c => {
      const chip = c.querySelector(".chip"); const sp = chip ? chip.textContent.replace(/[^A-Za-z]/g,"").toUpperCase() : "OTHER";
      sports[sp] = (sports[sp] || 0) + 1;
      if (c.querySelector(".badge.high")) high++;
      const meta = c.querySelector(".meta"); const mt = meta && /(\d{1,2}:\d{2}\s*[AP]M)\s*ET/i.exec(meta.textContent);
      if (mt) { const v = toMin(mt[1]); if (v != null && (first == null || v < first)) { first = v; firstTxt = mt[1].toUpperCase(); } }
    });
    const box = el("section","glance"); box.setAttribute("aria-label","At a glance");
    const tiles = el("div","tiles");
    tiles.append(
      tile(String(cards.length), cards.length === 1 ? "pick" : "picks", Object.keys(sports).map(k => sports[k] + " " + k).join(" · ")),
      tile(String(high), "high confidence", high ? null : "none rated high"),
      tile(firstTxt ? firstTxt.replace(/\s*[AP]M/,"") : "—", firstTxt ? firstTxt.slice(-2) + " ET first game" : "game time not found")
    );
    box.append(tiles);
    const best = cards[0], bt = best.querySelector("b");
    if (bt) {
      const row = el("button","row best"); row.type = "button";
      row.append(el("span","lbl","Best bet"), el("span","val", bt.textContent.trim()));
      const bd = best.querySelector(".badge"); if (bd) row.append(el("span", bd.className, bd.textContent));
      row.addEventListener("click", () => { best.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); });
      box.append(row);
    }
    box.append(recordRow());
    return box;
  }
  function record(){
    const rl = st.lists.results;
    if (!rl) return null;
    let h = 0, m = 0;
    rl.forEach(g => g.items.forEach(it => {
      const msg = st.msgs[it.id];
      if (!msg) return;
      const r = /(\d+)\s*HIT,\s*(\d+)\s*MISS/i.exec(msg.text || "");
      if (r) { h += +r[1]; m += +r[2]; }
    }));
    return { h, m };
  }
  function recordRow(){
    const r = record(), row = el("div","row rec");
    row.append(el("span","lbl","Last 5 Days"));
    if (!r || !(r.h + r.m)) row.append(el("span","val muted","No graded picks yet"));
    else {
      const pct = Math.round(100 * r.h / (r.h + r.m));
      const v = el("span","val"); v.append(el("b", r.h >= r.m ? "hit" : "miss", r.h + "–" + r.m), document.createTextNode(" · " + pct + "% hit"));
      row.append(v);
    }
    return row;
  }

  const STOP = new Set("to win the and ml at vs over under anytime goal scorer moneyline spread total game half first pick plus".split(" "));
  const toks = s => s.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w => w.length >= 3 && !STOP.has(w) && !/^\d/.test(w));
  const dir = s => /\bover\b/i.test(s) ? "over" : /\bunder\b/i.test(s) ? "under" : "";
  const fmtMD = d => new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",month:"short",day:"numeric"}).format(d);
  const PILL = { HIT:"✓ HIT", MISS:"✗ MISS", PUSH:"PUSH", VOID:"VOID", PENDING:"PENDING", UPCOMING:"UPCOMING", NORESULT:"NO RESULT" };
  // Results graded straight from ESPN final scores / box scores (no results email needed)
  function espnResults(view, g){
    const picks = picksOf(g); if (!picks.length) return false;
    const day = dayOf(g), box = el("div");
    const draw = () => {
      box.replaceChildren();
      const c = liveCache[day];
      if (!c) { box.append(el("p", "fine", "Checking ESPN for scores…")); return; }
      const rows = c.rows.map(r => {
        let status = { hit: "HIT", miss: "MISS", push: "PUSH", live: "PENDING", pending: "PENDING", none: "NORESULT" }[r.res];
        if (r.res === "pending" && /\d:\d\d\s*[AP]M/.test(r.sub)) status = "UPCOMING";
        const note = r.res === "none" ? (r.text ? r.text.replace(" (no line stated)", "") + " · no line stated, so it can't be graded" : "No line stated, so it can't be graded") : [r.text, r.sub].filter(Boolean).join(" · ") || "Waiting for the game";
        return { r, status, note };
      });
      const n = s => rows.filter(x => s.includes(x.status)).length;
      const tiles = el("div", "tiles");
      tiles.append(tile(String(n(["HIT"])), "hit"), tile(String(n(["MISS"])), "miss"), tile(String(n(["PENDING", "UPCOMING"])), "still to go"));
      const gl = el("section", "glance"); gl.append(tiles, recordRow()); box.append(gl);
      if (c.err) box.append(el("p", "fine", "Couldn't reach ESPN for some games, so those picks show as pending. Check your connection, or whether a content blocker is stopping scores from loading."));
      const list = el("div", "res-list");
      rows.forEach(x => {
        const row = el("div", "res-row " + x.status.toLowerCase()), top = el("div", "res-top");
        const chip = el("span", "chip", x.r.p.sp); chip.style.setProperty("--sp", "var(" + (SPVAR[x.r.p.sp] || "--other") + ")");

  const liveCache = {};   // "day" -> { at, rows, live, soon, done, err }
  async function refreshLive(day, picks){
    const sports = Array.from(new Set(picks.map(p => p.sp)));
    const games = {};
    await Promise.all(sports.map(async sp => { try { games[sp] = await getGames(sp, day); } catch (e) { games[sp] = null; } }));
    const rows = await Promise.all(picks.map(p => gradePick(p, games[p.sp]).catch(() => ({ p, res: "pending", text: "", sub: "Couldn't check", live: false }))));
    const all = [].concat(...Object.values(games).filter(Boolean));
    const now = Date.now();
    const c = { at: new Date(), rows,
      live: all.some(g => g.state === "in"),
      soon: all.some(g => g.state === "pre" && g.start - now < 45 * 60 * 1000),
      done: all.length > 0 && all.every(g => g.state === "post"),
      err: sports.some(sp => !games[sp]) };
    liveCache[day] = c; st.liveAt = c.at; stamp(); return c;
  }
  const LRES = { hit: "HIT", miss: "MISS", live: "LIVE", push: "PUSH", pending: "PENDING", none: "—" };
  function fillLive(box, day){
    const c = liveCache[day]; box.replaceChildren();
    const head = el("div", "lv-head");
    head.append(el("h3", null, "Live scores"));
    const stamp = el("span", "lv-stamp", c ? (c.live ? "Live from ESPN · " : "From ESPN · ") + fmtTime(c.at) + " ET" : "Checking ESPN…");
    if (c && c.live) stamp.classList.add("on");
    head.append(stamp); box.append(head);
    if (!c) return;
    const n = k => c.rows.filter(r => r.res === k).length;
    const sum = [n("hit") + " hit", n("miss") + " miss", n("live") + " live", n("pending") + " pending"];
    if (n("push")) sum.splice(2, 0, n("push") + " push");
    box.append(el("p", "lv-sum", sum.join(" · ")));
    const list = el("div", "lv-list");
    c.rows.forEach(r => {
      const row = el("div", "lv-row r-" + r.res);
      const top = el("div", "lv-top");
      const chip = el("span", "chip", r.p.sp); chip.style.setProperty("--sp", "var(" + (SPVAR[r.p.sp] || "--other") + ")");
      const rt = el("div", "lv-right");
      if (r.val) rt.append(el("span", "lv-val", r.val));
      rt.append(el("span", "lv-res", LRES[r.res] || ""));
      top.append(chip, el("b", null, r.p.label), rt);
      row.append(top);
      const sub = [r.text, r.sub].filter(Boolean).join(" · ");
      if (sub) row.append(el("div", "lv-sub", sub));
      list.append(row);
    });
    box.append(list);
    if (c.err) box.append(el("p", "lv-sum", "Some scores couldn't be reached; showing what loaded."));
  }
  let liveCur = null;   // { day, picks, box }
  function ensureLive(force){
    if (!liveCur) return;
    const { day, picks, box, fill } = liveCur, c = liveCache[day];
    const age = c ? Date.now() - c.at : Infinity;
    const need = !c || force || (!c.done && age > (c.live ? 25e3 : c.soon ? 60e3 : 5 * 60e3));
    if (!need) return;
    refreshLive(day, picks).then(() => { if (liveCur && liveCur.day === day && box.isConnected) fill(); }).catch(() => {});
  }
  function dayOf(g){
    const sm = /([A-Z][a-z]{2,8})\w*\s+(\d{1,2}),\s*(\d{4})/.exec(g.items[0].subject);
    if (sm) { const d = new Date(sm[1].slice(0, 3) + " " + sm[2] + ", " + sm[3] + " 12:00:00"); if (!isNaN(d)) return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    return g.key;
  }
  function picksOf(g){
    const texts = g.items.map(i => st.msgs[i.id] && st.msgs[i.id].text).filter(Boolean);
    return parsePicks(texts).filter(p => LEAGUES[p.sp]);
  }
  // refresh button: pull ESPN again right now (ignores the cache age) and restamp the header
  function forceLive(){
    if (!liveCur) return Promise.resolve();
    const { day, picks, box, fill } = liveCur;
    return refreshLive(day, picks).then(() => { if (liveCur && liveCur.day === day && box.isConnected) fill(); }).catch(() => {});
  }
  function liveSection(g){
    const picks = picksOf(g);
    if (!picks.length) { liveCur = null; return null; }
    const day = dayOf(g);
    const box = el("section", "lv"); box.setAttribute("aria-label", "Live scores");
    liveCur = { day, picks, box, fill: () => fillLive(box, day) };
    liveCur.fill(); ensureLive(false);
    return box;
  }
  setInterval(() => { if (!document.hidden && (st.tab === "picks" || st.tab === "results")) ensureLive(false); }, 20000);

  // ---------- load (and refresh every 5 minutes) ----------
  async function getJSON(path){
    const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(path + " " + r.status);
    return r.json();
  }
  function checkBuild(){
    fetch(location.pathname + "?b=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(t => {
      const m = /const BUILD = "([^"]+)"/.exec(t);
      if (!m || m[1] === BUILD) return;
      let tried = ""; try { tried = sessionStorage.getItem("rlBuildTried") || ""; } catch (e) {}
      if (tried === m[1]) return;   // already tried once this session; don't loop
      try { sessionStorage.setItem("rlBuildTried", m[1]); } catch (e) {}
      location.replace(location.pathname + "?v=" + m[1] + location.hash);
    }).catch(() => {});
  }
  async function load(){
    checkBuild();
    try {
      const [emails, slips, bot] = await Promise.all([getJSON("data/emails.json"), getJSON("data/slips.json").catch(() => []), getJSON(/\/Rox-Locks-uat\//i.test(location.pathname) ? "/Rox-Locks-routine/data/bot.json" : "data/bot.json").catch(() => null)]);
      st.bot = bot && typeof bot === "object" ? bot : null;
      onSlips(slips);
      onEmails(Array.isArray(emails) ? emails : []);
      freshness();
      refreshBotLive().catch(() => {});
    } catch(e) {
      if (!st.loaded) { $("checked").textContent = "Couldn't load"; st.err = { h: "Couldn't load the picks", p: "Check your connection and try again.", retry: true }; render(); }
    }
  }
  let savedTab = ""; try { savedTab = localStorage.getItem("rlTab") || ""; } catch (e) {}
  setTab(location.hash.slice(1) || savedTab || "picks", false);
  $("refresh").addEventListener("click", async () => {
    const b = $("refresh"); if (b.classList.contains("spin")) return;
    b.classList.add("spin"); b.setAttribute("aria-busy", "true");
    const t0 = Date.now();
    try { await load(); await forceLive(); } finally {
      setTimeout(() => { b.classList.remove("spin"); b.removeAttribute("aria-busy"); }, Math.max(0, 600 - (Date.now() - t0)));
    }
  });
  load();
  setInterval(load, 5 * 60 * 1000);
  setInterval(() => { if (!document.hidden) refreshBotLive().catch(() => {}); }, 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
